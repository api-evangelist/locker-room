name: Locker Room *
description: 'Locker Room was a live-audio social app for sports fans built by Betty Labs, a seed-stage
  startup backed by GV, Lightspeed Venture Partners, and Precursor Ventures. Launched in October 2020,
  it let insiders and fans hold real-time voice conversations about sports. Betty Labs and Locker Room
  were acquired by Spotify in March 2021 and folded into Spotify Greenroom / Spotify Live, which Spotify
  has since discontinued. Locker Room no longer operates as an independent product and exposes no public
  developer API or portal; this profile is retained as a GV portfolio lead in the API Evangelist network.'
